<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PyHookKit</title>
  <desc id="description">Send a Microsoft Teams Webhook notification in 10 minutes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131f"/>
      <stop offset="0.52" stop-color="#20275c"/>
      <stop offset="1" stop-color="#5534a5"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="15%" r="70%">
      <stop offset="0" stop-color="#6ee7f9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6ee7f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow)"/>
  <g transform="translate(76 72)">
    <rect width="1048" height="486" rx="30" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".16"/>
    <text x="54" y="102" fill="#b9c7ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">MICROSOFT TEAMS NOTIFICATIONS</text>
    <text x="54" y="200" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="68" font-weight="800">Teams Webhook in 10 minutes</text>
    <text x="54" y="270" fill="#e6e9ff" font-family="Inter,Arial,sans-serif" font-size="30">One posting identity. One shared Power Automate flow.</text>
    <g transform="translate(54 336)">
      <rect width="270" height="82" rx="20" fill="#2563eb"/>
      <text x="34" y="53" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">1. Posting identity</text>
      <rect x="292" width="310" height="82" rx="20" fill="#9333ea"/>
      <text x="326" y="53" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">2. Power Automate</text>
      <rect x="624" width="310" height="82" rx="20" fill="#0369a1"/>
      <text x="658" y="53" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">3. Send Hello World</text>
    </g>
  </g>
</svg>
