apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-productpage
  labels:
    app.kubernetes.io/name: productpage
    app.kubernetes.io/part-of: bookinfo
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: productpage
  labels:
    app.kubernetes.io/name: productpage
    app.kubernetes.io/part-of: bookinfo
    app: productpage
spec:
  selector:
    app: productpage
  ports:
    - name: http
      port: 9080
      targetPort: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
  labels:
    app.kubernetes.io/name: productpage
    app.kubernetes.io/part-of: bookinfo
    app: productpage
    version: v1
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: productpage
      version: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productpage
        app.kubernetes.io/part-of: bookinfo
        app: productpage
        version: v1
    spec:
      automountServiceAccountToken: false
      serviceAccountName: bookinfo-productpage
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: productpage
          image: docker.io/istio/examples-bookinfo-productpage-v1:1.20.2
          imagePullPolicy: IfNotPresent
          env:
            - name: DETAILS_HOSTNAME
              value: details
            - name: REVIEWS_HOSTNAME
              value: reviews
          ports:
            - containerPort: 9080
              name: http
          startupProbe:
            tcpSocket:
              port: 9080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
