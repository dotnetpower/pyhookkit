events {}

http {
  limit_req_zone $binary_remote_addr zone=pyhookkit_ingress:10m rate=10r/s;

  upstream pyhookkit_router {
    server router:8080;
    keepalive 16;
  }

  server {
    listen 443 ssl;
    server_name notify.example.test;

    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      proxy_pass http://pyhookkit_router;
      proxy_set_header Host $host;
    }

    location ~ ^/v1/(notifications(/[0-9a-f-]{36})?|destinations/[a-z0-9-]+/notifications|inbound/(github|gitlab|azure-devops)/[a-z0-9-]+)$ {
      limit_req zone=pyhookkit_ingress burst=20 nodelay;
      proxy_pass http://pyhookkit_router;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_request_buffering on;
      proxy_read_timeout 15s;
    }

    location / {
      return 404;
    }
  }
}
