apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-smoke
  labels:
    app.kubernetes.io/name: bookinfo-smoke
    app.kubernetes.io/part-of: bookinfo
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bookinfo-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: bookinfo-smoke
    app.kubernetes.io/part-of: bookinfo
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 360
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookinfo-smoke
        app.kubernetes.io/part-of: bookinfo
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      serviceAccountName: bookinfo-smoke
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
            - |
              for attempt in $(seq 1 60); do
                if curl --fail --silent --show-error http://productpage:9080/productpage | grep -q 'BookInfo Sample'; then
                  exit 0
                fi
                sleep 5
              done
              echo "productpage did not become ready in time" >&2
              exit 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
