apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-reviews
  labels:
    app.kubernetes.io/name: reviews
    app.kubernetes.io/part-of: bookinfo
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: reviews
  labels:
    app.kubernetes.io/name: reviews
    app.kubernetes.io/part-of: bookinfo
    app: reviews
spec:
  selector:
    app: reviews
  ports:
    - name: http
      port: 9080
      targetPort: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews
  labels:
    app.kubernetes.io/name: reviews
    app.kubernetes.io/part-of: bookinfo
    app: reviews
    version: v1
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: reviews
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reviews
        app.kubernetes.io/part-of: bookinfo
        app: reviews
        version: v1
    spec:
      automountServiceAccountToken: false
      serviceAccountName: bookinfo-reviews
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reviews
          image: docker.io/istio/examples-bookinfo-reviews-v1:1.20.2
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_DIR
              value: /tmp/logs
          ports:
            - containerPort: 9080
              name: http
          startupProbe:
            tcpSocket:
              port: 9080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9080
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: wlp-output
              mountPath: /opt/ibm/wlp/output
      volumes:
        - name: tmp
          emptyDir: {}
        - name: wlp-output
          emptyDir: {}
