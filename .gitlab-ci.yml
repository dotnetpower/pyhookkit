# GitLab owns GitOps promotion and provider delivery for the integrated scenario.
spec:
  inputs:
    action:
      description: Pipeline responsibility
      default: validate
      options:
        - validate
        - promote
        - maintenance-notice
    reviews-version:
      description: Approved Bookinfo Reviews variant
      default: v3
      options:
        - v1
        - v2
        - v3
    source-url:
      description: HTTPS audit link for the initiating workflow
      default: https://github.example.com/example/pyhookkit/actions
      regex: ^https://
    teams-delivery:
      description: Teams outbound adapter
      default: workflow
      options:
        - workflow
        - logic-app
---
stages:
  - validate
  - promote
  - notify

variables:
  GIT_DEPTH: "0"
  GITOPS_BRANCH: gitops-staging
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIPELINE_ACTION: $[[ inputs.action ]]
  REVIEWS_VERSION: $[[ inputs.reviews-version ]]
  SOURCE_URL: $[[ inputs.source-url ]]
  TEAMS_DELIVERY: $[[ inputs.teams-delivery ]]

validate-gitops:
  stage: validate
  image: alpine:3.22
  before_script:
    - apk add --no-cache kubectl
  script:
    - kubectl kustomize infra/gitops/bookinfo/base >/dev/null
    - kubectl kustomize infra/gitops/bookinfo/overlays/staging >/dev/null
    - kubectl kustomize infra/integrations/argocd >/dev/null
  rules:
    - if: $PIPELINE_ACTION == "validate"
    - if: $PIPELINE_ACTION == "promote"

promote-bookinfo:
  stage: promote
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash git kubectl python3
  script:
    - git fetch origin "$GITOPS_BRANCH"
    - git checkout -B "$GITOPS_BRANCH" "origin/$GITOPS_BRANCH"
    - infra/gitops/bookinfo/bin/set-staging-reviews.sh "$REVIEWS_VERSION"
    - git add infra/gitops/bookinfo/overlays/staging/kustomization.yaml
    - |
      if git diff --cached --quiet; then
        echo "Bookinfo Reviews is already at $REVIEWS_VERSION"
        exit 0
      fi
    - git config user.name "PyHookKit GitOps"
    - git config user.email "gitops@pyhookkit.example"
    - 'git commit -m "deploy: promote Bookinfo reviews $REVIEWS_VERSION" -m "Approved from $SOURCE_URL"'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:$GITOPS_BRANCH"
  resource_group: bookinfo-staging
  rules:
    - if: $PIPELINE_ACTION == "promote"

.teams-notification:
  image: python:3.12-slim
  before_script:
    - python -m pip install ./examples/python
    - |
      case "$TEAMS_DELIVERY" in
        workflow)
          test -n "$TEAMS_WORKFLOW_URL"
          ;;
        logic-app)
          test -n "$TEAMS_LOGIC_APP_URL"
          test -n "$TEAMS_LOGIC_APP_TEAM_ID"
          test -n "$TEAMS_LOGIC_APP_CHANNEL_ID"
          ;;
        *)
          echo "unsupported Teams delivery adapter: $TEAMS_DELIVERY" >&2
          exit 1
          ;;
      esac

notify-canonical-webhook:
  extends: .teams-notification
  stage: notify
  script:
    - test -n "$CANONICAL_NOTIFICATION"
    - printf '%s' "$CANONICAL_NOTIFICATION" > canonical-notification.json
    - python -m pyhookkit.entrypoints.scenario_cli --input canonical-notification.json --provider teams --teams-delivery "$TEAMS_DELIVERY" --teams-compact --teams-hide-group-mention-notice --send
  rules:
    - if: $PIPELINE_ACTION == "validate" && $CANONICAL_NOTIFICATION

notify-maintenance:
  extends: .teams-notification
  stage: notify
  script:
    - announced_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
    - window_start="$(date -u -d '+1 hour' '+%Y-%m-%dT%H:%M:%SZ')"
    - window_end="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
    - |
      python -m pyhookkit.entrypoints.scenario_cli \
        maintenance-notice \
        teams \
        --event-id "gitlab-${CI_PIPELINE_ID}-maintenance" \
        --correlation-id "gitlab-pipeline-${CI_PIPELINE_ID}" \
        --window-start "$window_start" \
        --window-end "$window_end" \
        --announced-at "$announced_at" \
        --affected-service productpage \
        --affected-service reviews \
        --expected-impact "Brief request retries during the staging exercise" \
        --owner-alias example-operations \
        --status-page-url "$CI_PIPELINE_URL" \
        --source gitlab-ci \
        --teams-delivery "$TEAMS_DELIVERY" \
        --teams-compact \
        --teams-hide-group-mention-notice \
        --send
  rules:
    - if: $PIPELINE_ACTION == "maintenance-notice"
