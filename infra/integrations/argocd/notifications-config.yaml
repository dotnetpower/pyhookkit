apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  context: |
    argocdUrl: https://argocd.example.com
    teamsDelivery: workflow
  service.webhook.gitlab-pipeline: |
    url: https://gitlab.example.com/api/v4/projects/123456/pipeline
    headers:
      - name: Content-Type
        value: application/json
      - name: PRIVATE-TOKEN
        value: $gitlab-api-token
    retryMax: 3
  service.webhook.notification-router: |
    url: https://router.pyhookkit.example/v1/notifications
    headers:
      - name: Content-Type
        value: application/json
      - name: X-PyHookKit-Producer
        value: argocd
      - name: Authorization
        value: Bearer $notification-router-token
    retryMax: 3
  template.bookinfo-sync-failed: |
    webhook:
      gitlab-pipeline:
        method: POST
        body: |
          {
            "ref": "main",
            "inputs": {
              "teams-delivery": "{{.context.teamsDelivery}}"
            },
            "variables": [
              {
                "key": "CANONICAL_NOTIFICATION",
                "value": "{\"schemaVersion\":\"1.0\",\"eventId\":\"argocd-{{.app.metadata.name}}-{{.app.status.sync.revision}}-failed\",\"route\":\"release-notifications\",\"title\":\"Bookinfo deployment failed\",\"body\":\"ERROR: Argo CD could not deploy Bookinfo revision {{.app.status.sync.revision}} to staging. Inspect application: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}\",\"severity\":\"error\",\"facts\":[{\"key\":\"Application\",\"value\":\"{{.app.metadata.name}}\"},{\"key\":\"Environment\",\"value\":\"staging\"},{\"key\":\"Revision\",\"value\":\"{{.app.status.sync.revision}}\"},{\"key\":\"Phase\",\"value\":\"{{.app.status.operationState.phase}}\"}],\"links\":[{\"label\":\"Inspect deployment\",\"url\":\"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}\"}],\"metadata\":{\"source\":\"argocd\",\"correlationId\":\"{{.app.status.sync.revision}}\"}}"
              }
            ]
          }
  template.bookinfo-sync-succeeded: |
    webhook:
      gitlab-pipeline:
        method: POST
        body: |
          {
            "ref": "main",
            "inputs": {
              "teams-delivery": "{{.context.teamsDelivery}}"
            },
            "variables": [
              {
                "key": "CANONICAL_NOTIFICATION",
                "value": "{\"schemaVersion\":\"1.0\",\"eventId\":\"argocd-{{.app.metadata.name}}-{{.app.status.sync.revision}}-succeeded\",\"route\":\"release-notifications\",\"title\":\"Bookinfo deployment succeeded\",\"body\":\"SUCCESS: Argo CD deployed Bookinfo revision {{.app.status.sync.revision}} to staging. View deployment: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}\",\"severity\":\"success\",\"facts\":[{\"key\":\"Application\",\"value\":\"{{.app.metadata.name}}\"},{\"key\":\"Environment\",\"value\":\"staging\"},{\"key\":\"Revision\",\"value\":\"{{.app.status.sync.revision}}\"},{\"key\":\"Duration\",\"value\":\"Recorded by Argo CD\"}],\"links\":[{\"label\":\"View deployment\",\"url\":\"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}\"}],\"metadata\":{\"source\":\"argocd\",\"correlationId\":\"{{.app.status.sync.revision}}\"}}"
              }
            ]
          }
  template.bookinfo-router-sync-failed: |
    webhook:
      notification-router:
        method: POST
        body: |
          {
            "schemaVersion": "1.0",
            "eventId": "argocd-{{.app.metadata.name}}-{{.app.status.sync.revision}}-failed",
            "route": "release-notifications",
            "title": "Bookinfo deployment failed",
            "body": "ERROR: Argo CD could not deploy Bookinfo revision {{.app.status.sync.revision}} to staging. Inspect application: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "severity": "error",
            "facts": [
              {"key": "Application", "value": "{{.app.metadata.name}}"},
              {"key": "Environment", "value": "staging"},
              {"key": "Revision", "value": "{{.app.status.sync.revision}}"},
              {"key": "Phase", "value": "{{.app.status.operationState.phase}}"}
            ],
            "links": [
              {
                "label": "Inspect deployment",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
              }
            ],
            "metadata": {
              "source": "argocd",
              "correlationId": "{{.app.status.sync.revision}}"
            }
          }
  template.bookinfo-router-sync-succeeded: |
    webhook:
      notification-router:
        method: POST
        body: |
          {
            "schemaVersion": "1.0",
            "eventId": "argocd-{{.app.metadata.name}}-{{.app.status.sync.revision}}-succeeded",
            "route": "release-notifications",
            "title": "Bookinfo deployment succeeded",
            "body": "SUCCESS: Argo CD deployed Bookinfo revision {{.app.status.sync.revision}} to staging. View deployment: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "severity": "success",
            "facts": [
              {"key": "Application", "value": "{{.app.metadata.name}}"},
              {"key": "Environment", "value": "staging"},
              {"key": "Revision", "value": "{{.app.status.sync.revision}}"},
              {"key": "Duration", "value": "Recorded by Argo CD"}
            ],
            "links": [
              {
                "label": "View deployment",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
              }
            ],
            "metadata": {
              "source": "argocd",
              "correlationId": "{{.app.status.sync.revision}}"
            }
          }
  trigger.on-bookinfo-sync-failed: |
    - description: Bookinfo sync failed
      oncePer: app.status.operationState.syncResult.revision
      send:
        - bookinfo-sync-failed
      when: app.status.operationState.phase in ['Error', 'Failed']
  trigger.on-bookinfo-sync-succeeded: |
    - description: Bookinfo sync succeeded and is healthy
      oncePer: app.status.operationState.syncResult.revision
      send:
        - bookinfo-sync-succeeded
      when: app.status.operationState.phase == 'Succeeded' and app.status.health.status == 'Healthy'
