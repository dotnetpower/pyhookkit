services:
  router:
    build:
      context: ../../..
      dockerfile: infra/runtime/container/Dockerfile
    command:
      - --database
      - /data/router.sqlite3
      - serve
      - --host
      - 0.0.0.0
      - --port
      - '8080'
    env_file:
      - ../../../.env
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - router-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s
    restart: unless-stopped

volumes:
  router-data:
