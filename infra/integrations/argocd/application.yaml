apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookinfo-staging
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-bookinfo-sync-failed.gitlab-pipeline: ""
    notifications.argoproj.io/subscribe.on-bookinfo-sync-succeeded.gitlab-pipeline: ""
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/example-platform/bookinfo-gitops.git
    targetRevision: gitops-staging
    path: infra/gitops/bookinfo/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: bookinfo-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
